<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142736"><title>EM ENGENHARIA – GESTÃO DE OBRAS</title><style>
:root{--navy:#142736;--orange:#F87E6A;--white:#fff;--bg:#f3f6f7;--ink:#20323d;--muted:#75838b;--line:#dfe6e9;--green:#21845b;--red:#b83737;--yellow:#c48a10;--shadow:0 6px 20px #14273612}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:white;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}.brand{font-weight:900;letter-spacing:.3px}.brand small{display:block;font-size:10px;letter-spacing:1.8px;color:#c9d6dc;margin-top:3px}.topright{display:flex;align-items:center;gap:9px}.wrap{max-width:1100px;margin:auto;padding:22px 18px 90px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.card h3,.card h2{margin:0 0 8px;color:var(--navy)}h1{font-size:25px;margin:0;color:var(--navy)}h2{font-size:20px;color:var(--navy);margin:0 0 13px}h3{font-size:16px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--orange);color:white;font-weight:750}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.btn.dark{background:var(--navy)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.5}.tabs{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:14px;margin-bottom:18px;border:1px solid var(--line)}.tab{white-space:nowrap;border:0;background:transparent;padding:10px 13px;border-radius:10px;color:var(--muted);font-weight:700}.tab.active{background:#fff0ed;color:#d85f4e}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{margin-bottom:12px}.field label{font-weight:700;font-size:13px;display:block;margin:0 0 6px;color:#344852}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink);outline-color:var(--orange)}.field textarea{min-height:85px;resize:vertical}.field input[type=checkbox]{width:auto;margin-right:8px}.field label{line-height:1.4}.progress{height:9px;background:#ebeff1;border-radius:9px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--orange)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-weight:750;font-size:12px;background:#eef2f4;color:var(--navy)}.pill.good{background:#e7f6ee;color:var(--green)}.pill.warn{background:#fff4d5;color:var(--yellow)}.pill.bad{background:#fde9e8;color:var(--red)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}th{color:var(--muted);font-size:12px}.navbottom{display:none}.hide{display:none!important}.notice{background:#fff6e4;border:1px solid #f1dfb2;border-radius:12px;padding:12px;color:#735914;font-size:13px}.empty{padding:25px;text-align:center;color:var(--muted)}.photo{width:100px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin:5px}.modalbg{position:fixed;inset:0;background:#0b1820a6;z-index:10;display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}.login{max-width:440px;margin:7vh auto;padding:18px}.loginhero{background:var(--navy);color:white;border-radius:18px;padding:27px;margin-bottom:18px}.kpi{font-size:28px;font-weight:900;color:var(--navy)}@media(max-width:600px){.top{padding:13px 15px}.wrap{padding:16px 13px 95px}h1{font-size:21px}.navbottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:6}.navbottom button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}.navbottom button.active{color:#df6856}.navbottom b{font-size:18px}.desktoponly{display:none}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast" class="toast hide"></div><script>
(()=>{'use strict';const KEY='emengenharia_v1';const stages=['Serviços preliminares','Terraplenagem','Fundação','Infraestrutura','Pilares','Vigas','Lajes','Alvenaria','Instalações hidráulicas','Instalações elétricas','Cobertura','Revestimentos','Contrapiso','Esquadrias','Pintura','Acabamentos','Entrega da obra'];const seed=[['Cimento CPIII','Cimento e argamassas','saco'],['Massical','Cimento e argamassas','saco'],['Cal','Cimento e argamassas','saco'],['Argamassa','Cimento e argamassas','saco'],['Arame recozido nº 17','Ferragens e arames','kg'],['Arame recozido nº 18','Ferragens e arames','kg'],['Pregos 21/27','Ferragens e arames','kg'],['Pregos 17/27','Ferragens e arames','kg'],['Pregos 18/27','Ferragens e arames','kg'],['Pregos 15/15','Ferragens e arames','kg'],['Tábuas de 15 mm','Madeiras','un'],['Tábuas de 10 mm','Madeiras','un'],['Sarrafos','Madeiras','un'],['Pontaletes','Madeiras','un'],['Compensados','Madeiras','un'],['Escoras metálicas','Escoramento','un'],['Escoras de madeira','Escoramento','un'],['Areia','Agregados','m³'],['Brita 0','Agregados','m³'],['Brita 1','Agregados','m³'],['Pedra','Agregados','m³'],['Tubulações','Outros materiais','un'],['Conexões','Outros materiais','un'],['Materiais elétricos','Outros materiais','un'],['Materiais hidráulicos','Outros materiais','un'],['Impermeabilizantes','Outros materiais','litro']];let db=load(),view='home',tab='Painel',workId=null,editing=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],works:[],user:null}}catch{return{users:[],works:[],user:null}}}function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(){return new Date().toISOString().slice(0,10)}function isAdmin(){return db.user?.role==='Administrador'}function allowedWorks(){return isAdmin()?db.works:db.works.filter(w=>(db.user?.workIds||[]).includes(w.id))}function current(){return allowedWorks().find(w=>w.id===workId)}function notify(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2500)}function role(){return db.user?.role||'Consulta'}function canEdit(){return role()!=='Consulta'}function nav(title='Minhas obras',sub=''){return `<header class="top"><div class="brand">EM ENGENHARIA<small>GESTÃO DE OBRAS</small></div><div class="topright">${view==='work'?'<button class="btn small secondary" onclick="App.goHome()">⌂ Menu inicial</button>':''}<span class="muted" style="color:#d2dde2">${esc(db.user?.name||'')}</span><button class="btn small secondary" onclick="App.logout()">Sair</button></div></header><main class="wrap"><div class="row between" style="margin-bottom:16px"><div><h1>${title}</h1><div class="muted">${sub}</div></div></div>`}function foot(){return `</main><nav class="navbottom">${[['home','⌂','Obras'],['inspect','☑','Fiscalizar'],['stock','▦','Estoque'],['stages','▤','Etapas'],['nc','⚠','Pendências']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="App.quick('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function login(){document.querySelector('#app').innerHTML=`<div class="login"><div class="loginhero"><div style="letter-spacing:2px;font-size:11px">EDLAINE MOTTA ENGENHARIA</div><h1 style="color:#fff;margin:12px 0 4px">GESTÃO DE OBRAS</h1><div style="color:#d2dde2">Acesso restrito a usuários cadastrados pelo administrador</div></div><section class="card"><div class="field"><label>Login</label><input id="loginname" autocomplete="username" placeholder="Informe seu login"></div><div class="field"><label>Senha</label><input id="loginpassword" type="password" autocomplete="current-password" placeholder="Informe sua senha" onkeydown="if(event.key==='Enter')App.login()"></div><button class="btn" style="width:100%" onclick="App.login()">Entrar</button><p class="muted">O cadastro de usuários é exclusivo do administrador. Solicite suas credenciais à administração.</p></section></div>`}
function home(){let works=allowedWorks();document.querySelector('#app').innerHTML=nav('Minhas obras',`Olá, ${esc(db.user?.name||'')} · perfil ${esc(role())}`)+`${isAdmin()?`<section class="card"><div class="row between"><div><h3>Administração</h3><div class="muted">Gerencie contas e permissões de acesso às obras.</div></div><button class="btn" onclick="App.manageUsers()">Gerenciar usuários</button></div></section>`:''}<section class="grid"><article class="card"><div class="muted">Obras disponíveis</div><div class="kpi">${works.length}</div></article><article class="card"><div class="muted">Pendências abertas</div><div class="kpi">${works.reduce((n,w)=>n+(w.ncs||[]).filter(x=>x.status!=='Resolvida').length,0)}</div></article><article class="card"><div class="muted">Fiscalizações</div><div class="kpi">${works.reduce((n,w)=>n+(w.inspections||[]).length,0)}</div></article></section><div class="row between"><h2>Obras autorizadas</h2>${isAdmin()?'<button class="btn" onclick="App.newWork()">＋ Cadastrar obra</button>':''}</div>${works.length?`<section class="grid">${works.map(w=>`<article class="card" onclick="App.open('${w.id}')" style="cursor:pointer"><div class="row between"><h3>${esc(w.name)}</h3><span class="pill">${esc(w.status)}</span></div><div class="muted">${esc(w.address||'Endereço não informado')}</div><div class="progress"><span style="width:${Number(w.progress)||0}%"></span></div><div class="row between muted"><span>${Number(w.progress)||0}% concluído</span><span>${esc(w.engineer||'')}</span></div>${isAdmin()?`<button class="btn small danger" onclick="event.stopPropagation();App.deleteWork('${w.id}')">Excluir obra</button>`:''}</article>`).join('')}</section>`:'<div class="card empty">Nenhuma obra foi vinculada ao seu usuário. Solicite ao administrador a liberação de acesso.</div>'}${foot()}`}
function workPage(){let w=current();if(!w){view='home';return home()}let tabs=['Painel','Fiscalizar','Estoque','Etapas','Fotos','Pendências','Relatórios'];let content='';if(tab==='Painel')content=`<section class="grid"><article class="card"><h3>Dados da obra</h3><div class="muted">Endereço: ${esc(w.address||'—')}<br>Cliente: ${esc(w.client||'—')}<br>Engenheiro: ${esc(w.engineer||'—')}<br>Início: ${esc(w.start||'—')} · Previsão: ${esc(w.end||'—')}</div><div class="progress"><span style="width:${w.progress||0}%"></span></div><span class="pill">${w.progress||0}% físico · ${esc(w.status)}</span></article><article class="card"><h3>Resumo</h3><p>${w.inspections.length} fiscalizações · ${w.materials.length} materiais · ${w.ncs.filter(n=>n.status!=='Resolvida').length} pendências abertas</p></article></section><div class="grid">${[['Fiscalizar','inspections'],['Controle de estoque','stock'],['Etapas da obra','stages'],['Não conformidades','nc'],['Registro fotográfico','photos'],['Relatórios','reports']].map(x=>`<button class="btn secondary" onclick="App.tab('${x[1]}')">${x[0]}</button>`).join('')}</div>`;
if(tab==='Fiscalizar'||tab==='inspections')content=`<div class="row"><button class="btn" onclick="App.newInspection('sapatas')">＋ Sapatas</button><button class="btn" onclick="App.newInspection('pilares')">＋ Pilares</button><button class="btn" onclick="App.newInspection('alvenaria')">＋ Alvenaria</button><button class="btn" onclick="App.newInspection('locação de pilares')">＋ Locação de pilares</button></div><h2 style="margin-top:18px">Histórico de fiscalizações</h2>${w.inspections.length?w.inspections.slice().reverse().map((i,n)=>`<article class="card"><div class="row between"><h3>${esc(i.kind)}</h3><span class="pill ${i.status==='Finalizada'?'good':'warn'}">${esc(i.status)}</span></div><p class="muted">${esc(i.date)} · ${esc(i.responsible)} · ${i.items.length} elemento(s)</p><button class="btn small secondary" onclick="App.viewInspection('${i.id}')">Abrir</button> <button class="btn small" onclick="App.pdfInspection('${i.id}')">Imprimir / PDF</button> ${canEdit()?`<button class="btn small danger" onclick="App.deleteInspection('${i.id}')">Excluir</button>`:''}</article>`).join(''):'<div class="card empty">Ainda não há fiscalizações.</div>'}`;
if(tab==='Estoque'||tab==='stock')content=`<div class="row"><button class="btn secondary" onclick="App.seed()">Adicionar catálogo inicial</button><button class="btn" onclick="App.newMaterial()">＋ Novo material</button><button class="btn secondary" onclick="App.tab('moves')">Histórico de movimentações</button></div><section class="card"><div class="field"><label>Pesquisar material</label><input id="stocksearch" oninput="App.filterStock()" placeholder="Nome do material"></div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Categoria</th><th>Un.</th><th>Saldo</th><th>Mínimo</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="stockbody">${stockRows(w)}</tbody></table></div></section>`;
if(tab==='moves')content=`<h2>Histórico de movimentações</h2><div class="card"><label class="muted">Filtrar por material</label><select id="movefilter" onchange="App.filterMoves()"><option value="">Todos</option>${w.materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="moveslist">${moveRows(w)}</div></div>`;
if(tab==='Etapas'||tab==='stages')content=`<div class="row"><button class="btn secondary" onclick="App.seedStages()">Criar etapas sugeridas</button><button class="btn" onclick="App.newStage()">＋ Nova etapa</button></div>${w.stages.map(s=>`<article class="card"><div class="row between"><h3>${esc(s.name)}</h3><span class="pill">${esc(s.status)}</span></div><div class="progress"><span style="width:${s.progress||0}%"></span></div><div class="muted">${s.progress||0}% · ${esc(s.responsible||'')}</div><button class="btn small secondary" onclick="App.editStage('${s.id}')">Atualizar</button> ${canEdit()?`<button class="btn small danger" onclick="App.deleteStage('${s.id}')">Excluir</button>`:''}</article>`).join('')||'<div class="card empty">Use “Criar etapas sugeridas”.</div>'}`;
if(tab==='Fotos'||tab==='photos')content=`<h2>Registro fotográfico</h2><button class="btn" onclick="App.photoRecord()">＋ Adicionar foto</button><div class="grid" style="margin-top:14px">${w.photos.slice().reverse().map(p=>`<article class="card"><img class="photo" style="width:100%;height:180px" src="${p.data}" alt="foto"><h3>${esc(p.element||p.stage||'Registro')}</h3><div class="muted">${esc(p.date)} · ${esc(p.description||'')}</div> ${canEdit()?`<button class="btn small danger" onclick="App.deletePhoto('${p.id}')">Excluir foto</button>`:''}</article>`).join('')}</div>`;
if(tab==='Pendências'||tab==='nc')content=`<div class="row"><button class="btn" onclick="App.newNC()">＋ Nova não conformidade</button><select id="ncfilter" onchange="App.filterNC()"><option value="">Todas</option><option>Aberta</option><option>Em correção</option><option>Resolvida</option></select></div><div id="nclist">${ncRows(w)}</div>`;
if(tab==='Relatórios'||tab==='reports')content=`<h2>Relatórios</h2><div class="grid"><button class="btn secondary" onclick="App.stockReport()">Estoque atual · PDF</button><button class="btn secondary" onclick="App.ncReport()">Não conformidades · PDF</button><button class="btn secondary" onclick="App.progressReport()">Andamento físico · PDF</button><button class="btn secondary" onclick="App.backup()">Baixar backup JSON</button><label class="btn secondary">Restaurar backup<input type="file" accept="application/json" hidden onchange="App.restore(event)"></label></div><p class="notice">Inspeções individualizadas também têm opção de imprimir/salvar como PDF no histórico.</p>`;
document.querySelector('#app').innerHTML=nav(w.name,`${esc(w.address||'')} · ${esc(w.status)} · ${w.progress||0}%`)+`<div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t?'active':''}" onclick="App.tab('${t}')">${t}</button>`).join('')}</div>${content}${foot()}`}
function stockRows(w){return w.materials.map(m=>{let state=+m.balance<+m.minimum?'bad':+m.balance<=+m.minimum*1.15?'warn':'good';return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.category)}</td><td>${esc(m.unit)}</td><td>${m.balance}</td><td>${m.minimum}</td><td><span class="pill ${state}">${state==='bad'?'Abaixo do mínimo':state==='warn'?'Próximo do mínimo':'Normal'}</span></td><td><button class="btn small" onclick="App.move('${m.id}','entrada')">Entrada</button> <button class="btn small secondary" onclick="App.move('${m.id}','saída')">Saída</button> ${canEdit()?`<button class="btn small danger" onclick="App.deleteMaterial('${m.id}')">Excluir</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7">Nenhum material cadastrado.</td></tr>'}function moveRows(w){return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th>Qtd.</th><th>Responsável</th><th>Saldo depois</th><th>Ação</th></tr></thead><tbody>${w.moves.slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(w.materials.find(x=>x.id===m.materialId)?.name||'Removido')}</td><td>${esc(m.kind)}</td><td>${m.qty}</td><td>${esc(m.responsible)}</td><td>${m.after}</td><td>${canEdit()?`<button class="btn small danger" onclick="App.deleteMove('${m.id}')">Excluir</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}function ncRows(w){return w.ncs.slice().reverse().map(n=>`<article class="card ncitem" data-status="${esc(n.status)}"><div class="row between"><h3>${esc(n.location||n.stage||'Pendência')}</h3><select onchange="App.setNCStatus('${n.id}',this.value)"><option ${n.status==='Aberta'?'selected':''}>Aberta</option><option ${n.status==='Em correção'?'selected':''}>Em correção</option><option ${n.status==='Resolvida'?'selected':''}>Resolvida</option></select></div><p>${esc(n.description)}</p><div class="muted">${esc(n.date)} · Correção: ${esc(n.responsible||'—')} · Prazo: ${esc(n.due||'—')}</div> ${canEdit()?`<button class="btn small danger" onclick="App.deleteNC('${n.id}')">Excluir</button>`:''}</article>`).join('')||'<div class="card empty">Sem não conformidades.</div>'}
function modal(title,body,onSave){document.querySelector('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)App.closeModal()"><div class="modal"><div class="row between"><h2>${title}</h2><button class="btn small secondary" onclick="App.closeModal()">Fechar</button></div>${body}</div></div>`}
function input(label,key,type='text',value='',opts=''){return `<div class="field"><label>${label}</label><input id="f_${key}" type="${type}" value="${esc(value)}" ${opts}></div>`}function textarea(label,key,value=''){return `<div class="field"><label>${label}</label><textarea id="f_${key}">${esc(value)}</textarea></div>`}function select(label,key,choices,value=''){return `<div class="field"><label>${label}</label><select id="f_${key}">${choices.map(c=>`<option ${c===value?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`}function val(key){return document.querySelector('#f_'+key)?.value?.trim()||''}
function render(){if(db.user){let live=db.users.find(u=>u.id===db.user.id&&u.active!==false);if(!live){db.user=null;persist() }else{db.user={id:live.id,name:live.name,login:live.login,role:live.role,workIds:live.workIds||[]}}}if(!db.user){login();return}if(view==='home'){home();return}if(!current()){view='home';home();return}workPage()}
window.App={async login(){let loginName=document.querySelector('#loginname').value.trim(),password=document.querySelector('#loginpassword').value;if(!loginName||!password)return alert('Informe login e senha.');let hash=await hashPassword(password),u=(db.users||[]).find(x=>String(x.login||'').toLowerCase()===loginName.toLowerCase()&&x.passwordHash===hash&&x.active!==false);if(!u)return alert('Login ou senha inválidos, ou usuário desativado.');db.user={id:u.id,name:u.name,login:u.login,role:u.role,workIds:u.workIds||[]};persist();render()},logout(){db.user=null;workId=null;view='home';persist();render()},goHome(){this.closeModal();workId=null;view='home';tab='Painel';render()},deleteWork(wid){if(!isAdmin())return alert('Acesso exclusivo do administrador.');let w=db.works.find(x=>x.id===wid);if(!w||!confirm(`Excluir a obra \"${w.name}\" e todos os seus registros? Esta ação não pode ser desfeita.`))return;db.works=db.works.filter(x=>x.id!==wid);db.users.forEach(u=>u.workIds=(u.workIds||[]).filter(x=>x!==wid));persist();render();notify('Obra excluída')},deleteUser(uid){if(!isAdmin())return alert('Acesso exclusivo do administrador.');let u=db.users.find(x=>x.id===uid);if(!u||u.role==='Administrador')return alert('A conta administrativa não pode ser excluída.');if(!confirm(`Excluir o usuário ${u.name}?`))return;db.users=db.users.filter(x=>x.id!==uid);persist();this.manageUsers();notify('Usuário excluído')},deleteInspection(iid){if(!canEdit()||!confirm('Excluir esta fiscalização e todos os elementos e fotos vinculados?'))return;current().inspections=current().inspections.filter(x=>x.id!==iid);persist();render();notify('Fiscalização excluída')},deleteInspectionItem(iid,index){if(!canEdit()||!confirm('Excluir este elemento e suas fotos?'))return;let i=current().inspections.find(x=>x.id===iid);if(i)i.items.splice(index,1);persist();this.viewInspection(iid)},deleteInspectionPhoto(iid,itemIndex,photoIndex){if(!canEdit()||!confirm('Excluir esta foto da fiscalização?'))return;let async function initialize(){db.users=Array.isArray(db.users)?db.users.filter(u=>u&&u.login&&u.passwordHash):[];db.users.forEach(u=>{if(String(u.login).toLowerCase()!=='edlaine'&&u.role==='Administrador')u.role='Consulta'});db.works=Array.isArray(db.works)?db.works:[];let admin=db.users.find(u=>String(u.login).toLowerCase()==='edlaine');if(!admin){db.users.push({id:id(),name:'Edlaine',login:'Edlaine',passwordHash:await hashPassword('123456'),role:'Administrador',workIds:[],active:true,mustChangePassword:false,created:date()});persist()}else{admin.role='Administrador';admin.active=true;admin.workIds=[];admin.mustChangePassword=false;persist()}render()}
function readFile(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function printDoc(body){let win=window.open('','_blank');if(!win)return alert('Permita janelas pop-up para gerar o PDF.');win.document.write(`<html><head><meta charset="utf-8"><title>Relatório EM Engenharia</title><style>body{font:14px Arial;color:#142736;margin:28px}h1{color:#142736}h2{color:#F87E6A;border-bottom:1px solid #ddd;padding-bottom:6px}img{object-fit:contain}table{border-collapse:collapse;width:100%}td,th{padding:8px}</style></head><body>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);win.document.close()}
